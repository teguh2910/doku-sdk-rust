[package]
name = "doku-sdk"
version = "0.1.0"
edition = "2021"
description = "Unofficial Rust SDK for DOKU Payment Gateway (Checkout, Direct, SNAP BI, Sub Account)"
license = "MIT OR Apache-2.0"
keywords = ["doku", "payment-gateway", "snap", "fintech", "indonesia"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rsa = { version = "0.9", features = ["pem", "sha2"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
pkcs1 = { version = "0.7", features = ["pem"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
